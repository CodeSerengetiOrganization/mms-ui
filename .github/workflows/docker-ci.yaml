name: Build and Push Next.js Frontend Image

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and jq
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install jq for version parsing
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set version tags
        run: |
          SEMVER=$(jq -r ".version" package.json)
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "FULL_TAG=$SEMVER-$SHORT_SHA" >> $GITHUB_ENV
          echo "SEMANTIC_TAG=$SEMVER" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/codeserengetiorganization/mms-ui:${{ env.FULL_TAG }}
            ghcr.io/codeserengetiorganization/mms-ui:${{ env.SEMANTIC_TAG }}
            ghcr.io/codeserengetiorganization/mms-ui:latest
